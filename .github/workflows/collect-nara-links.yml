name: Collect Nara notice detail links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_nara_links.py'
      - 'data/nara.json'
      - '.github/workflows/collect-nara-links.yml'
permissions:
  contents: read
concurrency:
  group: nkis-data-maintenance
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test link matching
        run: python -m unittest discover -s tests -p 'test_nara_links.py'
      - name: Fetch notice detail links
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY || secrets.PRISM_API_KEY }}
        run: python scripts/collect_nara_links.py
      - name: Save public detail links
        run: |
          git add data/nara-links.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Nara notice detail links'
          git pull --rebase origin main
          git push origin HEAD:main
  publish:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
