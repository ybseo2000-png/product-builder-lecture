name: Collect NKIS reports
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collect-nkis
  cancel-in-progress: false
jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test collector and data contract
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/data.test.cjs
      - name: Collect all pages
        env:
          NKIS_API_KEY: ${{ secrets.NKIS_API_KEY }}
        run: python scripts/collect_nkis.py
      - name: Validate public data
        run: node scripts/validate-data.cjs
      - name: Commit collected data
        run: |
          git add data/research.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update NKIS research reports'
          git push origin HEAD:main
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html research.html bids.html _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
