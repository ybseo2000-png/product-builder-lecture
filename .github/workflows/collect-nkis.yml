name: Collect NKIS reports
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nkis-data-maintenance
  cancel-in-progress: false
jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test collector and data contract
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/data.test.cjs
      - name: Collect all pages
        env:
          NKIS_API_KEY: ${{ secrets.NKIS_API_KEY }}
        run: python scripts/collect_nkis.py --rows 100
      - name: Validate public data
        run: node scripts/validate-data.cjs
      - name: Commit collected data
        run: |
          git add data/research.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update NKIS research reports'
          git push origin HEAD:main
  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
