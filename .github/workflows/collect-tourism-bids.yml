name: Collect tourism service notices
on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_tourism_bids.py'
      - '.github/workflows/collect-tourism-bids.yml'
permissions:
  contents: read
concurrency:
  group: nkis-data-maintenance
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test monthly pagination
        run: python -m unittest discover -s tests -p 'test_tourism_bids.py'
      - name: Collect monthly notices
        env:
          PRISM_API_KEY: ${{ secrets.PRISM_API_KEY }}
        run: python scripts/collect_tourism_bids.py
      - name: Preserve checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-notices-checkpoint
          path: data/tourism-bids.json
      - name: Save collected notices
        if: always()
        run: |
          git add data/tourism-bids.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update tourism service notices'
          git pull --rebase origin main
          git push origin HEAD:main
  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
